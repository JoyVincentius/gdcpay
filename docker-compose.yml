services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gdcpay
      POSTGRES_PASSWORD: gdcpay
      POSTGRES_DB: gdcpay
    ports:
      - "5401:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gdcpay"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:v4.17.1
    volumes:
      - ./migrations:/migrations
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      [
        "migrate",
        "-path", "/migrations",
        "-database", "postgres://gdcpay:gdcpay@db:5432/gdcpay?sslmode=disable",
        "up"
      ]

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_PORT: "8080"
      DATABASE_URL: "postgres://gdcpay:gdcpay@db:5432/gdcpay?sslmode=disable"
      JWT_SECRET: "change-me-in-production"
      JWT_EXPIRES_IN: "24h"
      IDEMPOTENCY_TTL: "24h"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  db_data:
